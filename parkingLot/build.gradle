plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

sourceCompatibility = '11'
targetCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
}

application {
    mainClass = 'org.example.ParkingLotDemo'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
